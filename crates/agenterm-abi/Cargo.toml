[package]
name = "agenterm-abi"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "libagenterm — thin C ABI export shell (mechanism boundary, not product authority)"
license = "MIT OR Apache-2.0"
autolib = false

[lib]
# cdylib —— 交付给 C 消费者的动态库（.dll / .so / .dylib）
# staticlib —— 交付给 C 消费者的静态库（.a / Windows .lib），
#   导出同一批 agt_* 符号，适合不想带动态库文件的嵌入场景
# rlib —— 进程内 Rust 消费者（agenterm-cu）直接 `use agenterm::`
# lib target 名是 `agenterm`（包名保持 `agenterm-abi`）：产物文件名
# 与 plan §14 的 `libagenterm.{so,dylib,dll}` 承诺一致，Windows 上是
# `agenterm.dll`（+ 导入库 `agenterm.dll.lib`）/ `agenterm.lib`，
# Unix 上是 `libagenterm.so` / `.dylib` / `libagenterm.a`，rlib 是
# `libagenterm.rlib`。
name = "agenterm"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Escapes the `panic = "abort"` compile_error! gate for Rust-native rlib
# consumers that have no C/FFI boundary. Default OFF: the delivered cdylib
# must always be built with the dedicated unwind profiles (abi-release /
# abi-dev) so every `catch_unwind` fence stays meaningful. Enabling this
# feature means the abort-profile build ships NO panic fence — only
# in-process Rust consumers without a C boundary may use it.
allow-abort-profile = []

[dependencies]
# The PTY mechanism (milestone 2). `pty` is a real feature: without it the
# whole `agenterm_platform::pty` module does not exist. `native-pixel-window`
# (milestone 3a) gates the `window_host` blocking callback loop, which in
# turn requires the `input` + `ime` features (its contract re-exports their
# types). `screenshot` (milestone 4) gates the whole
# `agenterm_platform::screenshot` module: without it the exports below cannot
# compile. `process` (milestone 5) gates the whole
# `agenterm_platform::process` module. `clipboard` (milestone 8) gates the
# whole `agenterm_platform::clipboard` module: without it the exports below
# cannot compile. `parent-console` (milestone 9) gates the whole
# `agenterm_platform::parent_console` module: without it the exports below
# cannot compile. `a11y-tree` (milestone 6) gates accessibility-tree observe
# and node actuation. `runtime` (milestone 10) gates the whole
# `agenterm_platform::runtime` module: without it the runtime exports below
# cannot compile. `window-enum` / `window-op` / `input-inject` (milestone 43)
# gate the native-window enumeration, native-window operation and input
# injection mechanisms: without them the `agt_window_enumerate` /
# `agt_native_window_*` / `agt_input_*` exports cannot compile.
agenterm-platform = { path = "../agenterm-platform", features = ["pty", "native-pixel-window", "portable-pixel-window", "input", "ime", "screenshot", "process", "network-resolve", "clipboard", "parent-console", "a11y-tree", "runtime", "window-enum", "window-op", "input-inject", "desktop-host"] }

[build-dependencies]
# build.rs is host-compiled; this must remain available to Linux/macOS hosts
# that cross-build the Windows cdylib.
winresource = "0.1"

[dev-dependencies]
# The dylib-load acceptance regression (tests/dylib_load.rs) dlopens the built
# cdylib to prove the FFI contract (NUL-terminated C strings, §3.8 fence).
libloading = "0.8"
# c_consumer.rs uses cc::windows_registry::find_tool to locate the MSVC
# toolchain without requiring vcvarsall to have been sourced into PATH.
cc = "1.4"
# export_exactness.rs (milestone 54) parses the built cdylib's export table
# with `object` (ELF dynsym / Mach-O external-defined symbols / PE export
# directory) so the "export set == exports.txt ∪ platform allowlist" gate
# never shells out to nm/dumpbin. `read` covers all three formats; the
# default `compression` feature is not needed (no debug-section parsing) and
# would only drag in flate2/ruzstd.
object = { version = "0.39.1", default-features = false, features = ["read", "std"] }
