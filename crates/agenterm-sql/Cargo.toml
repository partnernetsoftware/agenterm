[package]
name = "agenterm-sql"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "AgenTerm sql pack language scaffold: SQL-92/PostgreSQL-benchmarked script engine, capability-aligned with agenterm-rh/agenterm-lua/agenterm-qjswasm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/agenterm"
publish = false
# No [[bin]] here — mirrors agenterm-rh's shape: the real
# `agenterm-sql` binary is declared in the ROOT Cargo.toml's [[bin]] list
# with path = "crates/agenterm-sql/src/main.rs", compiled as part of the
# root `agenterm` package (same reason qjs/lua's bins are: so main.rs can
# reach `agenterm::` internals once/if a real execute design lands).

[lib]
name = "agenterm_sql"
path = "src/lib.rs"

[dependencies]
agenterm-script-common = { path = "../agenterm-script-common" }
sqlparser = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M1 execution engine (plan/design-sql-execution-target.md §0/§2.1/§5): a
# private, in-process, ephemeral SQLite database per `execute()` call. This
# is a REAL (non-dev) dependency — `eval.rs`'s `execute_entry` needs it at
# runtime, not just under `#[cfg(test)]`. `bundled` compiles the SQLite C
# amalgamation via `cc` and statically links it — no system SQLite
# dependency, same "vendored C dependency" shape `agenterm-lua`'s `mlua`
# (`vendored` LuaJIT) already established as precedent in this workspace
# (design doc §3.2/risk 2).
# `hooks` additionally enables `Connection::progress_handler`, used to
# enforce `ScriptBudgets.wall_time_ms` (design doc §5 M1's "至少落地
# wall_time_ms ... 两项" budget bullet) — `bundled` alone does not pull it in.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }

[dev-dependencies]
agenterm-script-common = { path = "../agenterm-script-common", features = ["test-support"] }
tempfile = "3.25"
