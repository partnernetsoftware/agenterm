[package]
name = "agenterm-qjswasm"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "AgenTerm's own script engine: compiles .qjs to .wasm in pure Rust and runs both on tinyvm (no JIT). Not rquickjs, not a QuickJS C binding."
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/agenterm"
publish = false

[lib]
name = "agenterm_qjswasm"
path = "src/lib.rs"

[dependencies]
# The shared corpus-scan / check-many drivers every engine's CLI wrapper uses.
agenterm-script-common = { path = "../agenterm-script-common" }
# tinyvm is the execution core; tinyvm-qjs is the `.qjs` -> `.wasm` compiler.
# Both pinned by revision, never vendored: the write knife lives in ../tinyvm
# (PRD 35). A private-repo git dep needs the system git client -- see
# .cargo/config.toml's `[net] git-fetch-with-cli`, measured against a real 401
# from cargo's built-in libgit2 client.
#
# `tinyvm-qjs` was deliberately NOT a dependency until 2026-08-24, on the
# argument that agenterm's language must not be hostage to another repo's
# schedule. That decision is withdrawn -- see PRD 36 and
# plan/design-agenterm-qjswasm.md 2. The compiler contains no agenterm
# vocabulary, so the layering rule governs: generic engine capability upstream,
# business here. This crate keeps the half that is business -- the `agenterm.*`
# door, slots, budget policy -- and re-exports the compiler's face.
tinyvm = { git = "https://github.com/partnernetsoftware/tinyvm", rev = "8bbdf2d" }
tinyvm-qjs = { git = "https://github.com/partnernetsoftware/tinyvm", rev = "8bbdf2d" }

[dev-dependencies]
# The shared corpus-scan contract: the scenarios every engine's scanner has to
# satisfy, so this crate's wrapper is held to the same ones lua's and qjs's are.
agenterm-script-common = { path = "../agenterm-script-common", features = ["test-support"] }
# Test-only: hand-authoring adversarial guests (infinite loop, deep recursion,
# out-of-bounds pointer, memory.grow bomb) is far more legible as `.wat` than as
# hand-encoded bytes. tinyvm's own suite uses the same crate the same way.
# Never a runtime dependency: the encoder that produces this crate's own wasm
# lives upstream in `tinyvm-qjs`.
wat = "1"
