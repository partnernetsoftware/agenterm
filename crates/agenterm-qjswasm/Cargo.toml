[package]
name = "agenterm-qjswasm"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "AgenTerm's own script engine: compiles .qjs to .wasm in pure Rust and runs both on tinyvm (no JIT). Not rquickjs, not a QuickJS C binding."
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/agenterm"
publish = false

[lib]
name = "agenterm_qjswasm"
path = "src/lib.rs"

[dependencies]
# tinyvm is the execution core. Pinned by revision, never vendored: the write
# knife lives in ../tinyvm (PRD 35). A private-repo git dep needs the system
# git client -- see .cargo/config.toml's `[net] git-fetch-with-cli`, measured
# against a real 401 from cargo's built-in libgit2 client.
#
# Deliberately NOT depending on `tinyvm-qjs`: that is tinyvm's own demo skin.
# This crate grows agenterm's own language, so its compiler must not be hostage
# to another repository's schedule (PRD 36 discipline).
tinyvm = { git = "https://github.com/partnernetsoftware/tinyvm", rev = "2f27570" }

[dev-dependencies]
# Test-only: hand-authoring adversarial guests (infinite loop, deep recursion,
# out-of-bounds pointer, memory.grow bomb) is far more legible as `.wat` than as
# hand-encoded bytes. tinyvm's own suite uses the same crate the same way.
# Never a runtime dependency: the product's own encoder is in src/lower/.
wat = "1"
