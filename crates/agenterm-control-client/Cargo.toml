[package]
name = "agenterm-control-client"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "Bounded typed client for the local AgenTerm control protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/agenterm"

[dependencies]
agenterm-platform = { path = "../agenterm-platform", default-features = false, features = ["ipc", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
