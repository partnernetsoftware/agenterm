[package]
name = "agenterm-control-client"
version = "0.1.20"
edition = "2024"
rust-version = "1.97"
description = "Bounded typed client for the local AgenTerm control protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/agenterm"

[dependencies]
minicon-platform = { git = "https://github.com/partnernetsoftware/minicon", rev = "0326e2abaf71cb2f8dc22f766de9b410efa4be1e", default-features = false, features = ["ipc", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
