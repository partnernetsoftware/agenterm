[package]
name = "agenterm-cu"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "Agenterm computer-use foundation: abstract command surface over the shared libagenterm dynamic library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/agenterm"

[build-dependencies]
# build.rs runs on the host. Keep this unconditional so macOS/Linux
# cross-builds can compile the Windows target's VERSIONINFO.
winresource = "0.1"
miniz_oxide = "0.8"
serde_json = "1"

[dependencies]
agenterm-control-client = { path = "../agenterm-control-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
# `agenterm-cu` loads desktop mechanisms from libagenterm at run time
# (dlopen / LoadLibrary) through the shared `crate::dynlib` boundary. The
# narrow static platform dependency below owns the cross-process grant-store
# lock and the sealed current desktop-session identity mechanism. Desktop
# actuation continues to load libagenterm dynamically.
libloading = "0.8"
sha2 = { version = "0.11", default-features = false }
agenterm-platform = { path = "../agenterm-platform", default-features = false, features = ["current-target-binding", "ipc", "locking", "process", "process-spawn", "contained-process-spawn", "filesystem", "filesystem-entry", "filesystem-open", "filesystem-publish", "file-identity", "network-interfaces", "network-routes", "network-dns", "device-capture", "device-inventory", "device-io", "host-open", "host-notification", "permission-settings", "serde", "simulator", "host-resource-snapshot", "storage-device-inventory"] }

[target.'cfg(windows)'.dependencies]
agenterm-platform = { path = "../agenterm-platform", default-features = false, features = ["native-messaging-registry"] }

# These feature lists must stay complete on their own. Until milestone 46 the
# crate also depended on `agenterm-platform`, whose winit tree enabled
# `NSRunningApplication` and `NSThread` for us; Cargo feature unification made
# that invisible, and dropping the dependency took them away. Only the macOS CI
# job compiles this target, so anything missing here fails there and nowhere
# else.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    # Defines NSApplicationActivationPolicy, which -setActivationPolicy: takes.
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.2.2", features = [
    "NSDictionary",
    # Gates MainThreadMarker::new(); the default feature set is just "std".
    "NSThread",
    "NSValue",
] }

[[bin]]
name = "agenterm-cu"
path = "src/bin/agenterm_cu.rs"
