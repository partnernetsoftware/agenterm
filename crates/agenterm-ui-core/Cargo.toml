[package]
name = "agenterm-ui-core"
version = "0.1.18"
edition = "2024"
rust-version = "1.97"
description = "Host-neutral AgenTerm interaction geometry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partnernetsoftware/agenterm"

[lib]
path = "src/lib.rs"

[features]
default = []
terminal-selection = ["dep:vt100"]

[dependencies]
vt100 = { version = "0.16", optional = true }
