# Standalone lab package — not a workspace member of the product tree.
# Public library name: `shmbox`. CLI harness: `mmap-lab`.
[workspace]

[package]
name = "mmap-ephemeral-lab"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "shmbox"
path = "src/lib.rs"

[[bin]]
name = "mmap-lab"
path = "src/bin/mmap_lab.rs"

# Zero crates.io deps: PATH `cc` shims break build-scripts (libc/memmap2).
# mmap / os_sync via raw FFI in `src/ffi.rs`.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
