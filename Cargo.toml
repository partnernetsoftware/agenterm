[workspace]
members = [".", "examples/size-probe", "crates/agenterm-control-client", "crates/agenterm-cu", "crates/agenterm-platform", "crates/agenterm-abi", "crates/agenterm-ui-core", "crates/agenterm-script-common", "crates/agenterm-lua", "crates/agenterm-sql", "crates/agenterm-qjswasm", "crates/agenterm-dyn", "crates/agenterm-chassis", "crates/agenterm-vnc", "crates/agenterm-vnc-app", "third_party/vnc-rs"]
resolver = "2"

[package]
name = "agenterm"
version = "0.1.16"
edition = "2024"
rust-version = "1.97"
description = "A tabbed Windows cmd.exe terminal with persistent exited tabs"
license = "MIT OR Apache-2.0"
autobins = false

[[bin]]
name = "agenterm"
path = "src/bin/agenterm.rs"

[[bin]]
name = "agenterm-com"
path = "src/bin/agenterm-com.rs"

[[bin]]
name = "agenterm-cc"
path = "src/bin/agenterm-cc.rs"

[features]
# `.qjs` is the product's script language: the default build carries its
# engine, so `cargo build` produces a worker that can run the repository's
# own qualification (`task run check`), which the unix bootstrap builds with
# no feature flags. Until 2026-08-30 the default was empty and every such
# worker answered "this build compiles no script engine in". lua and sql stay
# opt-in.
default = ["script-qjswasm"]
script-lua = ["agenterm-lua"]
script-sql = ["agenterm-sql"]
script-qjswasm = ["agenterm-qjswasm"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("agenterm-lua", "agenterm-qjswasm", "agenterm-sql", "default", "script-lua", "script-qjswasm", "script-sql"))'] }

[dependencies]
agenterm-chassis = { path = "crates/agenterm-chassis" }
agenterm-platform = { path = "crates/agenterm-platform", default-features = false, features = ["activation", "clipboard", "console-interrupt", "console-line-editor", "filesystem", "font", "ime", "input", "ipc", "locking", "portable-pixel-window", "process", "pty", "screenshot", "serde", "webview", "window"] }
agenterm-ui-core = { path = "crates/agenterm-ui-core", features = ["terminal-selection"] }
agenterm-lua = { path = "crates/agenterm-lua", optional = true }
# The shared corpus-scan / check-many report types the engine trait speaks.
# Not optional: `ScriptEngineBackend::corpus_scan` names them in its signature,
# so the trait cannot compile without them whichever engines are enabled.
agenterm-script-common = { path = "crates/agenterm-script-common" }
agenterm-sql = { path = "crates/agenterm-sql", optional = true }
agenterm-qjswasm = { path = "crates/agenterm-qjswasm", optional = true }
ab_glyph = "0.2.32"
anyhow = "1"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tempfile = "3.25"
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[build-dependencies]
# build.rs runs on the host. Keep this dependency available on Linux/macOS so
# cross-built MSVC artifacts receive the same VERSIONINFO as native builds.
winresource = "0.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Test-only: `tests/portable_guest_two_engines.rs` writes its guest in `wat`
# so the module says its own import list in five readable lines. Never a
# runtime dependency -- the product never assembles wasm from text.
wat = "1"

[profile.dev]
debug = 1
incremental = true
panic = "abort"

# `cargo test` links dozens of integration binaries, each pulling in the whole crate.
# Carrying dev's debug info through all of them is what drives peak memory on
# an 8 GB machine; line tables still give readable panic locations, which is
# all the suite needs. Set `debug = 1` here when stepping through a test in a
# debugger.
[profile.test]
debug = 0
incremental = true

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Fast optimized builds for local testing. Keep the distributable release
# profile focused on size, while allowing Cargo to reuse work between builds.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# agenterm-abi is the libagenterm cdylib: every export is wrapped in
# catch_unwind (§3.8 of the libagenterm spec), which requires unwind. The
# workspace profiles are aborting, and per-package panic overrides are not
# allowed by Cargo, so this needs dedicated unwind profiles of its own. The
# lightweight host used to carry the same pair as `con-*`; it left for the
# `minicon` repository, where the default profiles are already unwind.
[profile.abi-dev]
inherits = "dev"
panic = "unwind"

[profile.abi-release]
inherits = "release"
panic = "unwind"

# Vendored with one change: macOS frames are tagged with the display's color
# space so Core Animation presents without a per-frame vImage conversion.
[patch.crates-io]
softbuffer = { path = "third_party/softbuffer" }
# Vendored with one change: the col_wrap row bookkeeping saturates instead of
# underflowing (and aborting) when a resize or one-line scroll region leaves
# the cursor on the scroll region's top row.
vt100 = { path = "third_party/vt100" }
