name: Release asset integrity

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      promotion_run_id:
        description: Successful Promotion run ID whose published bytes should be re-audited
        required: true
        type: string

concurrency:
  group: release-asset-integrity
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve Promotion manifest and immutable identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          promotion="$RUNNER_TEMP/agenterm-promotion"
          mkdir -p "$promotion"
          gh run download "$PROMOTION_RUN_ID" \
            --repo "$GH_REPO" \
            --name "verified-promotion-$PROMOTION_RUN_ID" \
            --dir "$promotion"
          manifest="$(
            find "$promotion" -maxdepth 1 -type f \
              -name 'agenterm-*-candidate-manifest.json' -print -quit
          )"
          test -n "$manifest"
          tag="$(jq -er .expected_tag "$manifest")"
          version="$(jq -er .version "$manifest")"
          source_sha="$(jq -er .source_sha "$manifest")"
          [[ "$tag" == "v$version" ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          actual_tag_sha="$(
            gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha
          )"
          [[ "$actual_tag_sha" == "$source_sha" ]]
          gh release view "$tag" --repo "$GH_REPO" >/dev/null

          release="$RUNNER_TEMP/agenterm-release"
          mkdir -p "$release"
          gh release download "$tag" \
            --repo "$GH_REPO" \
            --dir "$release"

          expected="$RUNNER_TEMP/agenterm-release-expected.txt"
          actual="$RUNNER_TEMP/agenterm-release-actual.txt"
          {
            jq -r '
              .assets[] |
              .name, .checksum.name, .provenance.name
            ' "$manifest"
            jq -r '.sbom.name, .qualification.name' "$manifest"
            jq -r '.unsigned_macos_readmes[].name' "$manifest"
            basename "$manifest"
            echo releases.json
          } | sort >"$expected"
          find "$release" -maxdepth 1 -type f -printf '%f\n' |
            sort >"$actual"
          diff -u "$expected" "$actual"

          release_manifest="$release/$(basename "$manifest")"
          [[ "$(sha256sum "$release_manifest" | cut -d' ' -f1)" == \
            "$(sha256sum "$manifest" | cut -d' ' -f1)" ]]
          manifest_sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
          jq -e \
            --arg source_sha "$source_sha" \
            --arg version "$version" \
            --arg tag "$tag" \
            --arg manifest_sha "$manifest_sha" \
            --slurpfile manifest "$manifest" '
              .schema_version == 1
              and .kind == "agenterm-releases-index"
              and .product == "AgenTerm"
              and .source.kind == "agenterm-release-candidate"
              and .source.source_sha == $source_sha
              and .source.version == $version
              and .source.tag == $tag
              and .source.manifest_sha256 == $manifest_sha
              and (.releases | length) == 1
              and .releases[0].version == $version
              and .releases[0].tag == $tag
              and .releases[0].source_commit == $source_sha
              and (.releases[0].artifacts | length) == 7
              and (
                [.releases[0].artifacts[] |
                  {
                    name,
                    os,
                    arch,
                    sha256,
                    source_commit,
                    source_tag,
                    checksum: {
                      name: .checksum.name,
                      sha256: .checksum.sha256
                    },
                    provenance: {
                      name: .provenance.name,
                      sha256: .provenance.sha256
                    }
                  }
                ] | sort_by(.name)
              ) == (
                [$manifest[0].assets[] |
                  {
                    name,
                    os,
                    arch,
                    sha256,
                    source_commit: $source_sha,
                    source_tag: $tag,
                    checksum: {
                      name: .checksum.name,
                      sha256: .checksum.sha256
                    },
                    provenance: {
                      name: .provenance.name,
                      sha256: .provenance.sha256
                    }
                  }
                ] | sort_by(.name)
              )
            ' "$release/releases.json" >/dev/null
          sbom_name="$(jq -r .sbom.name "$manifest")"
          receipt_name="$(jq -r .qualification.name "$manifest")"
          [[ "$(sha256sum "$release/$sbom_name" | cut -d' ' -f1)" == \
            "$(jq -r .sbom.sha256 "$manifest")" ]]
          [[ "$(sha256sum "$release/$receipt_name" | cut -d' ' -f1)" == \
            "$(jq -r .qualification.sha256 "$manifest")" ]]

          while IFS=$'\t' read -r item os arch channel signed notarized
          do
            (cd "$release" && sha256sum -c "$item.sha256")
            expected_sha="$(sha256sum "$release/$item" | cut -d' ' -f1)"
            provenance="$release/$item.provenance.json"
            [[ "$(jq -r .artifact "$provenance")" == "$item" ]]
            [[ "$(jq -r .sha256 "$provenance")" == "$expected_sha" ]]
            [[ "$(jq -r .source_commit "$provenance")" == "$source_sha" ]]
            [[ "$(jq -r .source_tag "$provenance")" == "$tag" ]]
            [[ "$(jq -r .os "$provenance")" == "$os" ]]
            [[ "$(jq -r .arch "$provenance")" == "$arch" ]]
            [[ "$(jq -r .channel "$provenance")" == "$channel" ]]
            [[ "$(jq -r .signed "$provenance")" == "$signed" ]]
            [[ "$(jq -r .notarized "$provenance")" == "$notarized" ]]
          done < <(
            jq -r '
              .assets[] |
              [
                .name,
                .os,
                .arch,
                .channel,
                (.signed | tostring),
                (.notarized | tostring)
              ] |
              @tsv
            ' "$manifest"
          )
