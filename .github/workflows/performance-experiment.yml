name: CI performance experiment

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to benchmark
        required: true
        type: string
      runner_class:
        description: Standard runner or configured trial runner
        required: true
        default: standard
        type: choice
        options:
          - standard
          - trial
      compiler_cache:
        description: Compilation cache strategy
        required: true
        default: target
        type: choice
        options:
          - target
          - sccache
          - none

concurrency:
  group: performance-experiment-${{ inputs.source_sha }}-${{ inputs.runner_class }}-${{ inputs.compiler_cache }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Validate bounded experiment selection
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUNNER_CLASS: ${{ inputs.runner_class }}
          TRIAL_RUNNER: ${{ vars.AGENTERM_WINDOWS_EXPERIMENT_RUNNER }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$RUNNER_CLASS" == "trial" ]]; then
            test -n "$TRIAL_RUNNER"
          fi

  benchmark:
    needs: preflight
    runs-on: >-
      ${{
        inputs.runner_class == 'trial' &&
        vars.AGENTERM_WINDOWS_EXPERIMENT_RUNNER ||
        'windows-latest'
      }}
    timeout-minutes: 45
    env:
      AGENTERM_NO_ACTIVATE: "1"
      CARGO_INCREMENTAL: ${{ inputs.compiler_cache == 'sccache' && '0' || '1' }}
      RUSTC_WRAPPER: ${{ inputs.compiler_cache == 'sccache' && 'sccache' || '' }}
      SCCACHE_GHA_ENABLED: ${{ inputs.compiler_cache == 'sccache' && 'true' || 'false' }}
      # A run starts with a unique remote namespace. Its ordered samples share
      # that namespace, so sample 1 is cold and samples 2-3 are genuinely warm.
      SCCACHE_GHA_VERSION: perf-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Verify exact source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Configure pinned sccache experiment
        if: inputs.compiler_cache == 'sccache'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install lint components
        run: rustup component add rustfmt clippy

      - name: Build experiment driver
        shell: cmd
        run: |
          @cargo build --quiet --locked --bin agenterm
          @if errorlevel 1 exit /b 1
          @copy /y target\debug\agenterm.exe "%RUNNER_TEMP%\agenterm.exe" >nul
          @if errorlevel 1 exit /b 1

      - name: Run ordered cold-to-warm Quick samples
        shell: cmd
        env:
          CACHE_STRATEGY: ${{ inputs.compiler_cache }}
        run: |
          @"%RUNNER_TEMP%\agenterm.exe" cli script task run performance-samples --manifest agenterm.tasks.json -- "%CACHE_STRATEGY%" performance-evidence
          @if errorlevel 1 exit /b 1

      - name: Aggregate typed experiment evidence
        shell: cmd
        run: >-
          "%RUNNER_TEMP%\agenterm.exe" cli script task run performance-summary
          --manifest agenterm.tasks.json --
          performance-evidence\performance-summary.json
          "${{ inputs.runner_class }}"
          "${{ inputs.compiler_cache }}"
          performance-evidence\performance-1.json
          performance-evidence\performance-2.json
          performance-evidence\performance-3.json
          sccache-1.json
          sccache-2.json
          sccache-3.json

      - name: Upload bounded experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-${{ inputs.runner_class }}-${{ inputs.compiler_cache }}-${{ github.run_id }}
          path: |
            performance-evidence/*.json
            sccache-*.json
          if-no-files-found: warn
          retention-days: 14
