name: Windows quality-gate survey

# One round of the full release quality gate that reports EVERY failing gate
# instead of stopping at the first.
#
# Why this exists: `candidate.yml`'s windows-x86_64 cell takes about 45 minutes
# and stops at its first failing gate, so a source tree holding five unrelated
# defects needs five rounds -- and about four hours -- to reveal five facts.
# On 2026-09-20 that shape cost thirteen rounds and 5.6 hours of wall clock for
# zero sealed Candidates. This workflow spends one round to learn the whole set.
#
# It is DIAGNOSTIC ONLY and cannot become a release path: `--survey` refuses to
# write a qualification receipt (see `check.qjs`, and the reverse-verified
# `a_surveyed_qualification_can_never_write_a_receipt` policy test), so nothing
# this workflow produces can be promoted or mistaken for a qualified Candidate.
# It uploads no candidate part and seals nothing.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit to survey
        required: true
        type: string
      runner:
        description: >-
          Runner label to survey on (default windows-latest). GitHub's hosted
          images differ in whether they grant Windows job breakaway, which
          decides whether a server can outlive the CLI that started it -- and
          several gates exist to prove exactly that. This input makes the
          difference measurable instead of assumed.
        required: false
        type: string
      only:
        description: >-
          Optional comma-separated gate ids. Narrows the survey to those gates
          so one suspect gate answers in minutes instead of waiting out the
          whole lane. Diagnostic only -- a narrowed run proves nothing about
          the gates it did not run, and survey mode cannot write a receipt
          either way.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-survey-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    # Longer than the Candidate cell's 90: surveying deliberately keeps going
    # after a failure, so a tree with several failing gates runs longer than the
    # fail-fast round it replaces.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Install lint components
        run: rustup component add rustfmt clippy

      - name: Restore Cargo cache
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # Shares the Candidate cell's cache key so a survey starts as warm as
          # the round it is diagnosing; restore-keys only, never saved, so a
          # survey can never poison the Candidate's cache.
          key: cargo-home-candidate-v2-windows-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-candidate-v2-windows-x86_64-${{ runner.os }}-${{ runner.arch }}-rust1.97-

      # Streamed, not buffered. The Candidate cell writes the gate output to a
      # file and `type`s it at the end, which is fine for a 45-minute round
      # that either seals or does not. A survey deliberately runs long, and a
      # reader who cannot see which gate it is on until the whole thing ends
      # has no way to tell progress from a hang.
      # Streamed, not buffered. The Candidate cell writes the gate output to a
      # file and `type`s it at the end, which is fine for a 45-minute round
      # that either seals or does not. A survey deliberately runs long, and a
      # reader who cannot see which gate it is on until the whole thing ends
      # has no way to tell progress from a hang.
      #
      # Git Bash, not PowerShell: `tee` streams and writes the log in one pass,
      # and the PowerShell migration ledger is right to refuse a new dependency
      # here for a convenience that bash already provides.
      - name: Survey the full release quality gate
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ONLY_GATES: ${{ inputs.only }}
          AGENTERM_SCRIPT_WORKER_STDERR: inherit
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/agenterm-survey.log"
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$SOURCE_SHA" ]]; then
            echo "Checked-out HEAD $head does not match requested SHA $SOURCE_SHA."
            exit 1
          fi
          git switch -C main "$SOURCE_SHA" || exit 1
          gate_args="--release --include-stress --survey"
          if [[ -n "${ONLY_GATES}" ]]; then
            gate_args="$gate_args --only ${ONLY_GATES}"
          fi
          gate_args="$gate_args --timing target/qualification/timing.json"
          cmd.exe //c "check.cmd $gate_args" 2>&1 | tee "$log"
          exit "${PIPESTATUS[0]}"

      - name: Summarize the surveyed failures
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/agenterm-survey.log"
          {
            echo "### Quality-gate survey"
            if [[ ! -f "$log" ]]; then
              echo "No survey log was produced."
              exit 0
            fi
            echo '```'
            grep -E '^(SURVEY|PASS:|SURVEY FAIL)' "$log" || echo "no gate lines in log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the survey log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-survey-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/agenterm-survey.log
            target/qualification/timing.json
            target/smoke/*.png
            # Each failing smoke gate names a FAILURE BUNDLE directory; a
            # survey exists to collect every failure at once, so it must carry
            # every bundle out with it.
            target/smoke/test-runs/**
