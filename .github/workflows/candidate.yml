name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character current main HEAD to qualify
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      signed_macos: ${{ steps.release_policy.outputs.signed_macos }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Verify exact current main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Resolve checked-in release policy
        id: release_policy
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "$(jq -r .schema_version release-policy.json)" = 1
          test "$(jq -r .version release-policy.json)" = "$version"
          test "$(jq -r .assets.native_six_cell release-policy.json)" = true
          test "$(jq -r .assets.chassis_product release-policy.json)" = true
          test "$(jq -r .assets.experimental_ape release-policy.json)" = false
          test "$(jq -r .signing.windows release-policy.json)" = off
          test "$(jq -r .signing.linux release-policy.json)" = off
          test "$(jq -r .executable_compression release-policy.json)" = off
          test "$(jq -r .reputation.windows_final_candidate_bytes release-policy.json)" = required
          macos_mode="$(jq -r .signing.macos release-policy.json)"
          case "$macos_mode" in
            required) signed_macos=true ;;
            unsigned-preview) signed_macos=false ;;
            *) echo "Unsupported macOS signing policy: $macos_mode" >&2; exit 1 ;;
          esac
          echo "signed_macos=$signed_macos" >>"$GITHUB_OUTPUT"

  build:
    needs: preflight
    env:
      AGENTERM_CANDIDATE_SOURCE_SHA: ${{ inputs.source_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: windows-x86_64
            runner: windows-latest
            # 90, not 45: this is the heaviest leg -- full release quality gate,
            # release-profile build, packaging and staging -- and it runs against
            # the Candidate-only `cargo-target-*-candidate-` cache prefix, so a
            # cold one has nothing warm to lean on. Candidate run 31551243623
            # spent 48m09s here and was killed at the 45m budget (GitHub records a
            # job timeout as `cancelled`), which skipped `aggregate` after the
            # other five legs had already succeeded.
            timeout_minutes: 90
          - platform_id: windows-aarch64
            runner: ubuntu-latest
            timeout_minutes: 45
          - platform_id: linux-x86_64
            runner: ubuntu-latest
            timeout_minutes: 30
          - platform_id: linux-aarch64
            runner: ubuntu-24.04-arm
            timeout_minutes: 30
          - platform_id: macos-aarch64
            runner: macos-latest
            timeout_minutes: 30
          - platform_id: macos-x86_64
            runner: macos-latest
            timeout_minutes: 30
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import sys

          cargo = open("Cargo.toml", encoding="utf-8").read()
          match = re.search(
              r'(?ms)^\[package\].*?^version\s*=\s*"(?P<version>[^"]+)"',
              cargo,
          )
          if not match:
              sys.exit("Could not read Cargo.toml package version.")
          expected = f"v{match.group('version')}"
          if expected == "v0.1.7":
              sys.exit("v0.1.7 is an internal-only baseline and cannot become a candidate.")
          PY

      - name: Install lint components
        if: matrix.platform_id == 'windows-x86_64'
        run: rustup component add rustfmt clippy

      - name: Restore Windows x86_64 debug and release-fast targets
        id: restore-windows-x86_64-target-cache
        if: matrix.platform_id == 'windows-x86_64'
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/release-fast/
            target/.rustc_info.json
          # Target/incremental state is exact-source only. Cross-SHA prefix
          # restore twice produced a Windows worker fast-fail (0xc0000409)
          # before the first gate; Cargo-home remains the reusable dependency
          # cache, while compiled target state must prove this exact source.
          key: cargo-target-v3-windows-x86_64-candidate-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ inputs.source_sha }}

      - name: Restore candidate Cargo cache
        id: restore-cargo-home-candidate
        if: matrix.platform_id != 'windows-aarch64'
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # R2: prefix restore so hashFiles drift still reuses registry (v0.1.15).
          key: cargo-home-candidate-v2-${{ matrix.platform_id }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-candidate-v2-${{ matrix.platform_id }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-

      - name: Report candidate cache hit profile
        if: matrix.platform_id == 'windows-x86_64' && always()
        shell: bash
        run: |
          {
            echo "### Candidate cache profile"
            echo "windows-x86_64.target-debug-release-fast-hit: ${{ steps.restore-windows-x86_64-target-cache.outputs.cache-hit }}"
            echo "windows-x86_64.cargo-home-hit: ${{ steps.restore-cargo-home-candidate.outputs.cache-hit }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Windows ARM64 cargo cache
        if: matrix.platform_id == 'windows-aarch64'
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-candidate-v2-windows-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}
          restore-keys: |
            cargo-home-candidate-v2-windows-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-

      - name: Run release quality gate
        if: matrix.platform_id == 'windows-x86_64'
        shell: cmd
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          @echo off
          set "LOG=%RUNNER_TEMP%\agenterm-release-check.log"
          for /f "delims=" %%H in ('git rev-parse HEAD') do set "ACTUAL_HEAD=%%H"
          if /I not "%ACTUAL_HEAD%"=="%SOURCE_SHA%" (
            echo Checked-out HEAD %ACTUAL_HEAD% does not match Candidate SHA %SOURCE_SHA%. > "%LOG%"
            type "%LOG%"
            exit /b 1
          )
          git switch -C main "%SOURCE_SHA%" > "%LOG%" 2>&1
          if errorlevel 1 (
            type "%LOG%"
            exit /b 1
          )
          call check.cmd --release --include-stress --timing target/qualification/timing.json >> "%LOG%" 2>&1
          set "CHECK_EXIT=%ERRORLEVEL%"
          type "%LOG%"
          exit /b %CHECK_EXIT%

      - name: Upload failed quality-gate diagnostics
        if: failure() && matrix.platform_id == 'windows-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-quality-gate-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/agenterm-release-check.log
            ${{ runner.temp }}/agenterm-theme-*.png
            ${{ runner.temp }}/agenterm-proxy-eye-*.png
            target/smoke/*.png

      - name: Publish Candidate quality timing summary
        # A4: the timing-summary task appends the per-gate table to GITHUB_STEP_SUMMARY
        # when that env is set (Actions always sets it). No artifact download needed.
        if: always() && matrix.platform_id == 'windows-x86_64'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f target/qualification/timing.json ]]; then
            echo "No timing.json; skip quality timing summary." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -x dist/agenterm.exe ]]; then
            dist/agenterm.exe cli script task run timing-summary \
              --manifest agenterm.tasks.json -- target/qualification/timing.json
          else
            target/debug/agenterm.exe cli script task run timing-summary \
              --manifest agenterm.tasks.json -- target/qualification/timing.json
          fi
          # Surface bootstrap reuse for R1 acceptance without opening the artifact.
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("target/qualification/timing.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          boot = report.get("bootstrap") or {}
          worker = (boot.get("worker") or {})
          line = (
              f"- **bootstrap.worker.state**: `{worker.get('state', '?')}` "
              f"(bootstrap `{boot.get('state', '?')}`)\n"
          )
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n### Candidate bootstrap (R1 signal)\n\n")
                  fh.write(line)
          print(line.strip())
          PY

      - name: Upload Candidate quality timing
        if: always() && matrix.platform_id == 'windows-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-quality-timing-${{ github.run_id }}
          path: target/qualification/timing.json
          if-no-files-found: warn
          retention-days: 14

      - name: Package Windows x86_64 release
        if: matrix.platform_id == 'windows-x86_64'
        shell: cmd
        run: >-
          dist\agenterm.exe cli script task run package-release-qualified
          --manifest agenterm.tasks.json

      - name: Install Windows ARM64 cross-build tooling
        if: matrix.platform_id == 'windows-aarch64'
        run: |
          rustup target add aarch64-pc-windows-msvc
          if [ ! -x "$HOME/.cargo/bin/cargo-xwin" ]; then
            cargo install cargo-xwin --locked
          fi

      - name: Build Windows ARM64 release
        if: matrix.platform_id == 'windows-aarch64'
        env:
          AGENTERM_BOOTSTRAP_TASK: client-build
        run: >-
          ./scripts/bootstrap.sh release
          --target aarch64-pc-windows-msvc --driver cargo-xwin

      - name: Package Windows ARM64 release
        if: matrix.platform_id == 'windows-aarch64'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ./scripts/bootstrap.sh "$VERSION" windows aarch64 \
            target/aarch64-pc-windows-msvc/release

      - name: Save Windows ARM64 cargo cache
        if: always() && matrix.platform_id == 'windows-aarch64'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-candidate-v2-windows-aarch64-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

      - name: Save Windows x86_64 debug and release-fast targets
        # Never promote a target tree from a failed quality process into the
        # exact-SHA cache. A failed run is evidence that these compiled bytes
        # are not reusable, regardless of whether Cargo considered them fresh.
        if: success() && matrix.platform_id == 'windows-x86_64'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/debug/
            target/release-fast/
            target/.rustc_info.json
          key: cargo-target-v3-windows-x86_64-candidate-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}-${{ inputs.source_sha }}

      - name: Save candidate Cargo cache
        if: always() && matrix.platform_id != 'windows-aarch64'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-candidate-v2-${{ matrix.platform_id }}-${{ runner.os }}-${{ runner.arch }}-rust1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'scripts/artifacts.json') }}

      - name: Build Linux x86_64 clients
        if: matrix.platform_id == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libwayland-client0
          AGENTERM_BOOTSTRAP_TASK=client-build \
            ./scripts/bootstrap.sh release \
            --target x86_64-unknown-linux-gnu

      - name: Package Linux x86_64 release
        if: matrix.platform_id == 'linux-x86_64'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ./scripts/bootstrap.sh \
            "$VERSION" linux x86_64 target/x86_64-unknown-linux-gnu/release

      - name: Install Linux ARM64 native packaging dependencies
        if: matrix.platform_id == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libxkbcommon0 libxkbcommon-x11-0
          rustup target add aarch64-unknown-linux-gnu

      - name: Build Linux ARM64 clients
        if: matrix.platform_id == 'linux-aarch64'
        env:
          AGENTERM_BOOTSTRAP_TASK: client-build
        run: >-
          ./scripts/bootstrap.sh release
          --target aarch64-unknown-linux-gnu

      - name: Package Linux ARM64 release
        if: matrix.platform_id == 'linux-aarch64'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ./scripts/bootstrap.sh \
            "$VERSION" linux aarch64 target/aarch64-unknown-linux-gnu/release

      - name: Verify bundled Linux XKB dependency closure
        if: startsWith(matrix.platform_id, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          arch="${{ matrix.platform_id }}"
          arch="${arch#linux-}"
          archive="dist/agenterm-$version-linux-$arch.tar.gz"
          root="$RUNNER_TEMP/linux-package-closure-$arch"
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          xkb="$(find "$root/lib" -maxdepth 1 -type f \
            -name 'libxkbcommon-x11.so.0*' -print -quit)"
          xcb="$(find "$root/lib" -maxdepth 1 -type f \
            -name 'libxcb-xkb.so.1*' -print -quit)"
          test -n "$xkb" && test -f "$xkb"
          test -n "$xcb" && test -f "$xcb"
          readelf -d "$xkb" | grep -Eq \
            'NEEDED.*\[libxcb-xkb\.so\.1\]'
          echo "Bundled closure: $(basename "$xkb") -> $(basename "$xcb")"

      - name: Import Apple Developer ID credentials
        if: >-
          startsWith(matrix.platform_id, 'macos-') &&
          needs.preflight.outputs.signed_macos == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Required macOS release secret is missing: $name" >&2
              exit 1
            fi
          done

          CERTIFICATE_PATH="$RUNNER_TEMP/agenterm-developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          python3 - "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          certificate_path, notary_key_path = map(pathlib.Path, sys.argv[1:3])
          certificate_path.write_bytes(
              base64.b64decode(
                  "".join(os.environ["APPLE_DEVELOPER_ID_P12_BASE64"].split()),
                  validate=True,
              )
          )
          notary_key_path.write_bytes(
              base64.b64decode(
                  "".join(os.environ["APPLE_NOTARY_KEY_P8_BASE64"].split()),
                  validate=True,
              )
          )
          PY

          KEYCHAIN_PATH="$RUNNER_TEMP/agenterm-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
              head -n 1
          )"
          if [[ -z "$IDENTITY" ]]; then
            echo "Imported certificate is not a Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Report macOS unsigned preview channel
        if: >-
          startsWith(matrix.platform_id, 'macos-') &&
          needs.preflight.outputs.signed_macos != 'true'
        run: |
          echo "Signed macOS stable publishing is disabled; this job will produce a visibly labeled unsigned preview."
          echo "Set release-policy.json signing.macos=required only after all Developer ID and notarization secrets are configured."

      - name: Generate deterministic macOS SPDX inventory
        if: startsWith(matrix.platform_id, 'macos-')
        env:
          AGENTERM_BOOTSTRAP_TASK: supply-chain
        run: ./scripts/bootstrap.sh . dist/agenterm-sbom.spdx.json

      - name: Build macOS ARM64 clients
        if: matrix.platform_id == 'macos-aarch64'
        run: |
          rustup target add aarch64-apple-darwin
          AGENTERM_BOOTSTRAP_TASK=client-build \
            ./scripts/bootstrap.sh release --target aarch64-apple-darwin

      - name: Sign macOS ARM64 clients
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          needs.preflight.outputs.signed_macos == 'true'
        run: |
          ./scripts/sign-macos-release.sh \
            aarch64 target/aarch64-apple-darwin/release

      - name: Package macOS ARM64 release
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          needs.preflight.outputs.signed_macos == 'true'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ./scripts/bootstrap.sh \
            "$VERSION" macos aarch64 target/aarch64-apple-darwin/release --signed

      - name: Notarize macOS ARM64 release
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          needs.preflight.outputs.signed_macos == 'true'
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ARCHIVE="dist/agenterm-${VERSION}-macos-aarch64.zip"
          RESULT="$(
            xcrun notarytool submit "$ARCHIVE" \
              --key "$APPLE_NOTARY_KEY_PATH" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait \
              --output-format json
          )"
          echo "$RESULT"
          RESULT="$RESULT" python3 - <<'PY'
          import json
          import os
          import sys

          result = json.loads(os.environ["RESULT"])
          if result.get("status") != "Accepted":
              sys.exit(f"Apple notarization was not accepted: {result}")
          PY
          target/aarch64-apple-darwin/release/agenterm cli script \
            task run finalize-macos-provenance --manifest agenterm.tasks.json -- \
            "$ARCHIVE" "$ARCHIVE.provenance.json"

      - name: Package macOS ARM64 unsigned preview
        if: >-
          matrix.platform_id == 'macos-aarch64' &&
          needs.preflight.outputs.signed_macos != 'true'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ./scripts/bootstrap.sh "$VERSION" macos aarch64 \
            target/aarch64-apple-darwin/release --unsigned-preview

      - name: Build macOS x86_64 clients
        if: matrix.platform_id == 'macos-x86_64'
        run: |
          rustup target add x86_64-apple-darwin
          AGENTERM_BOOTSTRAP_TASK=client-build \
            ./scripts/bootstrap.sh release --target x86_64-apple-darwin

      - name: Sign macOS x86_64 clients
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          needs.preflight.outputs.signed_macos == 'true'
        run: |
          ./scripts/sign-macos-release.sh \
            x86_64 target/x86_64-apple-darwin/release

      - name: Package macOS x86_64 release
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          needs.preflight.outputs.signed_macos == 'true'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ./scripts/bootstrap.sh \
            "$VERSION" macos x86_64 target/x86_64-apple-darwin/release --signed

      - name: Notarize macOS x86_64 release
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          needs.preflight.outputs.signed_macos == 'true'
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ARCHIVE="dist/agenterm-${VERSION}-macos-x86_64.zip"
          RESULT="$(
            xcrun notarytool submit "$ARCHIVE" \
              --key "$APPLE_NOTARY_KEY_PATH" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait \
              --output-format json
          )"
          echo "$RESULT"
          RESULT="$RESULT" python3 - <<'PY'
          import json
          import os
          import sys

          result = json.loads(os.environ["RESULT"])
          if result.get("status") != "Accepted":
              sys.exit(f"Apple notarization was not accepted: {result}")
          PY
          target/x86_64-apple-darwin/release/agenterm cli script \
            task run finalize-macos-provenance --manifest agenterm.tasks.json -- \
            "$ARCHIVE" "$ARCHIVE.provenance.json"

      - name: Package macOS x86_64 unsigned preview
        if: >-
          matrix.platform_id == 'macos-x86_64' &&
          needs.preflight.outputs.signed_macos != 'true'
        env:
          AGENTERM_BOOTSTRAP_TASK: package-client-release
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          ./scripts/bootstrap.sh "$VERSION" macos x86_64 \
            target/x86_64-apple-darwin/release --unsigned-preview

      - name: Build thin Chassis-L1 loader
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform_id }}" in
            windows-x86_64)
              cargo build --locked -p agenterm-chassis --features loader \
                --bin agenterm-chassis-loader --release
              loader="target/release/agenterm-chassis-loader.exe"
              ;;
            windows-aarch64)
              cargo xwin build --locked -p agenterm-chassis --features loader \
                --bin agenterm-chassis-loader --release \
                --target aarch64-pc-windows-msvc
              loader="target/aarch64-pc-windows-msvc/release/agenterm-chassis-loader.exe"
              ;;
            linux-x86_64)
              cargo build --locked -p agenterm-chassis --features loader \
                --bin agenterm-chassis-loader --release \
                --target x86_64-unknown-linux-gnu
              loader="target/x86_64-unknown-linux-gnu/release/agenterm-chassis-loader"
              ;;
            linux-aarch64)
              CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
                cargo build --locked -p agenterm-chassis --features loader \
                  --bin agenterm-chassis-loader --release \
                  --target aarch64-unknown-linux-gnu
              loader="target/aarch64-unknown-linux-gnu/release/agenterm-chassis-loader"
              ;;
            macos-aarch64)
              cargo build --locked -p agenterm-chassis --features loader \
                --bin agenterm-chassis-loader --release \
                --target aarch64-apple-darwin
              loader="target/aarch64-apple-darwin/release/agenterm-chassis-loader"
              ;;
            macos-x86_64)
              cargo build --locked -p agenterm-chassis --features loader \
                --bin agenterm-chassis-loader --release \
                --target x86_64-apple-darwin
              loader="target/x86_64-apple-darwin/release/agenterm-chassis-loader"
              ;;
          esac
          test -f "$loader"
          cp "$loader" target/chassis-l1-loader

      - name: Stage flat candidate part
        shell: bash
        env:
          PLATFORM_ID: ${{ matrix.platform_id }}
          SIGNED_MACOS: ${{ needs.preflight.outputs.signed_macos }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version="$(
            sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1
          )"
          stage="candidate-part"
          mkdir -p "$stage"
          case "$PLATFORM_ID" in
            windows-x86_64)
              cell="win-x86_64"
              archive="dist/agenterm-$version-windows-x86_64.zip"
              cp target/qualification/receipt.json \
                "$stage/qualification-receipt.json"
              cp "dist/agenterm-$version-sbom.spdx.json" "$stage/"
              ;;
            windows-aarch64)
              cell="win-aarch64"
              archive="dist/agenterm-$version-windows-aarch64.zip"
              ;;
            linux-x86_64)
              cell="lnx-x86_64"
              archive="dist/agenterm-$version-linux-x86_64.tar.gz"
              ;;
            linux-aarch64)
              cell="lnx-aarch64"
              archive="dist/agenterm-$version-linux-aarch64.tar.gz"
              ;;
            macos-aarch64|macos-x86_64)
              arch="${PLATFORM_ID#macos-}"
              cell="osx-$arch"
              if [[ "$SIGNED_MACOS" == "true" ]]; then
                archive="dist/agenterm-$version-macos-$arch.zip"
              else
                archive="dist/agenterm-$version-macos-$arch-unsigned-preview.zip"
                if [[ "$PLATFORM_ID" == "macos-aarch64" ]]; then
                  cp dist/MACOS_UNSIGNED_PREVIEW_README.md "$stage/"
                  cp dist/MACOS_UNSIGNED_PREVIEW_README.zh-Hant.md "$stage/"
                fi
              fi
              ;;
            *)
              echo "Unknown candidate platform: $PLATFORM_ID" >&2
              exit 1
              ;;
          esac
          test -f "$archive"
          test -f "$archive.sha256"
          test -f "$archive.provenance.json"
          cp "$archive" "$archive.sha256" "$archive.provenance.json" "$stage/"
          python3 scripts/chassis-stage-l1-loader.py \
            --loader target/chassis-l1-loader \
            --cell "$cell" \
            --version "$version" \
            --source-sha "$SOURCE_SHA" \
            --out "$stage"

      - name: Upload flat candidate part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-part-${{ matrix.platform_id }}
          path: candidate-part/
          if-no-files-found: error
          retention-days: 2

  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: windows-x86_64
            runner: windows-2025
            family: windows
          - platform_id: windows-aarch64
            runner: windows-11-arm
            family: windows
          - platform_id: linux-x86_64
            runner: ubuntu-24.04
            family: linux
          - platform_id: linux-aarch64
            runner: ubuntu-24.04-arm
            family: linux
          - platform_id: macos-aarch64
            runner: macos-15
            family: macos
          - platform_id: macos-x86_64
            runner: macos-15-intel
            family: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      # Runtime courts consume only the archive built by the matching build
      # cell. They deliberately do not checkout source or invoke Cargo.
      - name: Download matching Candidate part
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: candidate-part-${{ matrix.platform_id }}
          path: part

      - name: Execute final Windows archive
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem part -File -Filter 'agenterm-*-windows-*.zip' |
            Select-Object -First 1
          if (-not $archive) { throw 'runtime_archive_missing' }
          $sidecar = Get-Content "$($archive.FullName).sha256" -Raw
          $expectedHash = ($sidecar -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'runtime_archive_hash_mismatch' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath runtime
          $version = (Get-Content "$($archive.FullName).provenance.json" -Raw |
            ConvertFrom-Json).version
          $output = & .\runtime\agenterm.com cli --version
          if ($LASTEXITCODE -ne 0 -or "$output" -notmatch [regex]::Escape($version)) {
            throw "runtime_version_probe_failed: $output"
          }
          "PASS ${{ matrix.platform_id }} $actualHash $output"

      - name: Scan final Windows Candidate bytes with Defender
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mpcmd = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $mpcmd)) {
            $platformRoot = "$env:ProgramData\Microsoft\Windows Defender\Platform"
            $mpcmd = Get-ChildItem $platformRoot -Filter MpCmdRun.exe -File -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $mpcmd -or -not (Test-Path $mpcmd)) {
            throw 'defender_cli_missing'
          }
          & $mpcmd -Scan -ScanType 3 -File (Resolve-Path runtime).Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) {
            throw "defender_final_candidate_scan_failed:$LASTEXITCODE"
          }
          "DEFENDER PASS ${{ matrix.platform_id }}"

      - name: Execute final Linux archive
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find part -maxdepth 1 -type f \
            -name 'agenterm-*-linux-*.tar.gz' -print -quit)"
          test -n "$archive"
          (cd part && sha256sum -c "$(basename "$archive").sha256")
          mkdir runtime
          tar -xzf "$archive" -C runtime
          chmod +x runtime/agenterm
          version="$(jq -r .version "$archive.provenance.json")"
          output="$(runtime/agenterm cli --version)"
          grep -Fq "$version" <<<"$output"
          echo "PASS ${{ matrix.platform_id }} $(sha256sum "$archive" | cut -d' ' -f1) $output"

      - name: Prove Linux bundle closure in package-free Ubuntu
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # Official Ubuntu 24.04 multi-arch index, pinned so the court cannot
          # drift independently of the Candidate workflow hash.
          image='ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517'
          docker run --rm \
            -v "$PWD/runtime:/court:ro" \
            "$image" \
            bash -euo pipefail -c '
              shopt -s nullglob
              libraries=(/court/lib/*.so*)
              test "${#libraries[@]}" -gt 0
              for library in "${libraries[@]}"; do
                report="$(LD_LIBRARY_PATH=/court/lib ldd "$library")"
                missing="$(grep "not found" <<<"$report" || true)"
                if test -n "$missing"; then
                  echo "$library: $missing" >&2
                  exit 1
                fi
              done
              LD_LIBRARY_PATH=/court/lib /court/agenterm cli --version
            '

      - name: Execute final macOS archive
        if: matrix.family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find part -maxdepth 1 -type f \
            -name 'agenterm-*-macos-*.zip' -print -quit)"
          test -n "$archive"
          (cd part && shasum -a 256 -c "$(basename "$archive").sha256")
          mkdir runtime
          ditto -x -k "$archive" runtime
          chmod +x runtime/agenterm
          version="$(jq -r .version "$archive.provenance.json")"
          output="$(runtime/agenterm cli --version)"
          grep -Fq "$version" <<<"$output"
          echo "PASS ${{ matrix.platform_id }} $(shasum -a 256 "$archive" | cut -d' ' -f1) $output"

  aggregate:
    needs: [build, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Download candidate parts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: candidate-part-*
          merge-multiple: true
          path: candidate-input

      - name: Write candidate workflow metadata
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          workflow_sha256="$(sha256sum .github/workflows/candidate.yml | cut -d' ' -f1)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          created_at_unix_ms="$(( $(date -u +%s) * 1000 ))"
          expires_at_unix_ms="$(( created_at_unix_ms + 1209600000 ))"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$version" \
            --arg workflow_sha256 "$workflow_sha256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson created_at_unix_ms "$created_at_unix_ms" \
            --argjson expires_at_unix_ms "$expires_at_unix_ms" \
            '{
              schema_version: 1,
              source_sha: $source_sha,
              version: $version,
              expected_tag: ("v" + $version),
              workflow_path: ".github/workflows/candidate.yml",
              workflow_sha256: $workflow_sha256,
              run_id: $run_id,
              run_attempt: $run_attempt,
              run_event: env.GITHUB_EVENT_NAME,
              created_at_unix_ms: $created_at_unix_ms,
              expires_at_unix_ms: $expires_at_unix_ms
            }' >candidate-metadata.json

      - name: Extract candidate Script Runtime
        run: |
          set -euo pipefail
          archive="$(find candidate-input -maxdepth 1 -type f \
            -name 'agenterm-*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/agenterm-candidate-tool"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agenterm-candidate-tool"
          chmod +x "$RUNNER_TEMP/agenterm-candidate-tool/agenterm"

      - name: Compose Candidate chassis product without Cargo
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version="$(jq -r .version candidate-metadata.json)"
          python3 scripts/chassis-candidate-pack.py \
            --candidate-input candidate-input \
            --version "$version" \
            --source-sha "$SOURCE_SHA" \
            --out "candidate-input/agenterm-$version-chassis-product.tgz"

      - name: Seal exact candidate bundle
        run: |
          set -euo pipefail
          version="$(jq -r .version candidate-metadata.json)"
          test -f candidate-input/qualification-receipt.json
          mkdir -p candidate-output/payload
          cp candidate-input/* candidate-output/payload/
          "$RUNNER_TEMP/agenterm-candidate-tool/agenterm" cli script \
            task run candidate-aggregate --manifest agenterm.tasks.json -- \
            . candidate-metadata.json candidate-output/payload \
            "candidate-output/agenterm-$version-candidate-manifest.json"

      - name: Upload sealed candidate
        id: candidate-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: candidate-output/
          if-no-files-found: error
          retention-days: 14

      - name: Report candidate identity
        env:
          ARTIFACT_DIGEST: ${{ steps.candidate-upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.candidate-upload.outputs.artifact-id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          manifest="$(find candidate-output -maxdepth 1 -type f \
            -name 'agenterm-*-candidate-manifest.json' -print -quit)"
          test -f "$manifest"
          {
            echo "## AgenTerm release candidate"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- Retention: 14 days"
            echo
            echo "### Native archive sizes"
            echo
            echo "| Cell | Payload bytes | Archive bytes |"
            echo "|---|---:|---:|"
            jq -r '.assets[] | select(.os != "chassis") |
              "| \(.os)-\(.arch) | \(.payload_uncompressed_bytes) | \(.size) |"' \
              "$manifest"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Publish candidate delivery timing evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        if: always()
        run: |
          set -euo pipefail
          mkdir -p delivery-timing

          run_id="${CANDIDATE_RUN_ID}"
          workflow_name="Release Candidate"
          api_url="${GITHUB_API_URL%/}"
          run_json="$(mktemp)"
          jobs_json="$(mktemp)"

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api_url/repos/$GH_REPO/actions/runs/$run_id" > "$run_json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api_url/repos/$GH_REPO/actions/runs/$run_id/jobs?filter=all&per_page=200" \
            > "$jobs_json"

          python3 - "$run_json" "$jobs_json" "$workflow_name" "$run_id" "$GH_REPO" "$SOURCE_SHA" <<'PY'
          import datetime
          import json
          import os
          import sys

          def to_ms(value):
              if not value:
                  return None
              dt = datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
              return int(dt.timestamp() * 1000)

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          jobs_document = json.load(open(sys.argv[2], encoding="utf-8"))
          workflow_name = sys.argv[3]
          run_id = int(sys.argv[4])
          repository = sys.argv[5]
          source_sha = sys.argv[6]

          run_start = to_ms(run.get("run_started_at"))
          run_end = to_ms(run.get("updated_at"))
          queue_ms = None
          if run.get("created_at") and run_start is not None:
              queue_ms = max(0, run_start - to_ms(run.get("created_at")))
          run_ms = None if run_start is None or run_end is None else max(0, run_end - run_start)

          def step_ms(step):
              start = to_ms(step.get("started_at"))
              done = to_ms(step.get("completed_at"))
              if start is None or done is None or done < start:
                  return 0
              return max(0, done - start)

          def classify_stages(name):
              key = (name or "").lower()
              if "restore" in key or "cache" in key:
                  return "cache_ms"
              if "checkout" in key:
                  return "checkout_ms"
              if "rustup" in key or "install " in key or "toolchain" in key:
                  return "toolchain_ms"
              if "package" in key:
                  return "package_ms"
              if "upload" in key or "download" in key:
                  return "artifact_transfer_ms"
              if "quality gate" in key or "smoke" in key or "test" in key or "verify" in key:
                  return "test_ms"
              if "build" in key or "bootstrap" in key or "clippy" in key:
                  return "compile_ms"
              if "aggregate" in key:
                  return "aggregate_ms"
              if "create" in key and "release" in key:
                  return "aggregate_ms"
              return None

          stage_ms = {
              "checkout_ms": 0,
              "toolchain_ms": 0,
              "cache_ms": 0,
              "compile_ms": 0,
              "package_ms": 0,
              "test_ms": 0,
              "artifact_transfer_ms": 0,
              "aggregate_ms": 0,
          }
          for job in jobs_document.get("jobs", []):
              steps = job.get("steps") or []
              for step in steps:
                  target = classify_stages(step.get("name", ""))
                  if target is None:
                      continue
                  ms = step_ms(step)
                  stage_ms[target] += ms

          jobs = []
          for job in jobs_document.get("jobs", []):
              j_start = to_ms(job.get("started_at"))
              j_end = to_ms(job.get("completed_at"))
              j_ms = None if j_start is None or j_end is None or j_end < j_start else max(0, j_end - j_start)
              jobs.append({
                  "id": job.get("id"),
                  "name": job.get("name"),
                  "status": job.get("status"),
                  "conclusion": job.get("conclusion"),
                  "duration_ms": j_ms,
              })

          report = {
              "schema_version": 1,
              "kind": "agenterm-delivery-timing",
              "workflow": workflow_name,
              "repository": repository,
              "run_id": run_id,
              "source_sha": source_sha,
              "queue_duration_ms": queue_ms,
              "run_duration_ms": run_ms,
              "stage_duration_ms": stage_ms,
              "jobs": jobs,
          }
          with open("delivery-timing/candidate-delivery-timing.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2, sort_keys=True)
          PY

          rm -f "$run_json" "$jobs_json"

      - name: Upload candidate delivery timing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-delivery-timing-${{ github.run_id }}
          path: delivery-timing/
          if-no-files-found: error
          retention-days: 14
