name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character current main HEAD to qualify
        required: true
        type: string
      staging_release_id:
        description: Temporary prerelease ID containing the encrypted local six-cell input
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      signed_windows: ${{ steps.release_policy.outputs.signed_windows }}
      signed_macos: ${{ steps.release_policy.outputs.signed_macos }}
      # Named once by the attempt that uploads it. A rerun of failed jobs keeps
      # this successful job and its outputs, so consumers must not rebuild the
      # name from their own github.run_attempt.
      runtime_control_artifact: candidate-runtime-control-${{ github.run_id }}-${{ github.run_attempt }}
      local_input_artifact: candidate-local-input-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Verify exact current main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]]

      - name: Scan tracked public text for disclosures
        shell: bash
        run: ./scripts/doc-redact-check.sh

      - name: Resolve checked-in release policy
        id: release_policy
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version already exists; bump and commit the next version before Candidate" >&2
            exit 1
          fi
          test "$(jq -r .schema_version release-policy.json)" = 1
          test "$(jq -r .version release-policy.json)" = "$version"
          test "$(jq -r .assets.native_six_cell release-policy.json)" = true
          test "$(jq -r .assets.chassis_product release-policy.json)" = true
          test "$(jq -r .assets.experimental_ape release-policy.json)" = false
          windows_mode="$(jq -r .signing.windows release-policy.json)"
          case "$windows_mode" in
            off) signed_windows=false ;;
            required) signed_windows=true ;;
            *) echo "Unsupported Windows signing policy: $windows_mode" >&2; exit 1 ;;
          esac
          test "$(jq -r .signing.linux release-policy.json)" = off
          test "$(jq -r .executable_compression release-policy.json)" = off
          test "$(jq -r .reputation.windows_final_candidate_bytes release-policy.json)" = required
          macos_mode="$(jq -r .signing.macos release-policy.json)"
          case "$macos_mode" in
            required) signed_macos=true ;;
            unsigned-preview) signed_macos=false ;;
            *) echo "Unsupported macOS signing policy: $macos_mode" >&2; exit 1 ;;
          esac
          {
            echo "signed_windows=$signed_windows"
            echo "signed_macos=$signed_macos"
          } >>"$GITHUB_OUTPUT"

      - name: Download and verify encrypted local six-cell build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_SECRET_KEY: ${{ secrets.AGENTERM_CANDIDATE_AGE_IDENTITY }}
          STAGING_RELEASE_ID: ${{ inputs.staging_release_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$STAGING_RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ -n "$AGE_SECRET_KEY" ]] || { echo "encrypted Candidate identity is unavailable" >&2; exit 2; }
          release="repos/$GITHUB_REPOSITORY/releases/$STAGING_RELEASE_ID"
          release_json="$(gh api "$release")"
          jq -e --arg source "$SOURCE_SHA" '
            .draft == false and .prerelease == true
            and .target_commitish == $source
            and (.tag_name | test("^local-candidate-encrypted-" + $source + "-[0-9]{8}T[0-9]{6}Z$"))
          ' <<<"$release_json" >/dev/null
          stage_tag="$(jq -er .tag_name <<<"$release_json")"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$stage_tag" --jq .object.sha)" == "$SOURCE_SHA" ]]
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          bundle="agenterm-$version-local-candidate-input.tar.gz"
          assets="$(gh api "$release/assets?per_page=100")"
          jq -e --arg bundle "$bundle" '
            (length == 3)
            and ([.[].name] | sort) == ([($bundle + ".age"), ($bundle + ".age.sha256"), ($bundle + ".sha256")] | sort)
            and all(.[]; .state == "uploaded")
          ' <<<"$assets" >/dev/null
          encrypted_id="$(jq -er --arg name "$bundle.age" '[.[] | select(.name == $name)] | if length == 1 then .[0].id else error("encrypted asset count") end' <<<"$assets")"
          encrypted_checksum_id="$(jq -er --arg name "$bundle.age.sha256" '[.[] | select(.name == $name)] | if length == 1 then .[0].id else error("encrypted checksum asset count") end' <<<"$assets")"
          checksum_id="$(jq -er --arg name "$bundle.sha256" '[.[] | select(.name == $name)] | if length == 1 then .[0].id else error("checksum asset count") end' <<<"$assets")"
          mkdir -p local-input
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$encrypted_id" >"local-input/$bundle.age"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$encrypted_checksum_id" >"local-input/$bundle.age.sha256"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$checksum_id" >"local-input/$bundle.sha256"
          (cd local-input && sha256sum -c "$bundle.age.sha256")
          if ! command -v age >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
          fi
          printf '%s\n' "$AGE_SECRET_KEY" | age --decrypt --identity - \
            --output "local-input/$bundle" "local-input/$bundle.age"
          (cd local-input && sha256sum -c "$bundle.sha256")
          python3 scripts/verify-local-candidate.py \
            --archive "local-input/$bundle" \
            --checksum "local-input/$bundle.sha256" \
            --out "$RUNNER_TEMP/local-candidate" \
            --source-sha "$SOURCE_SHA" --version "$version"
          mkdir -p "$RUNNER_TEMP/verified-local-input"
          cp -R "$RUNNER_TEMP/local-candidate/candidate-input" \
            "$RUNNER_TEMP/verified-local-input/"

      - name: Upload verified local build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-local-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-local-input/candidate-input/
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-source ACU runtime control
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-runtime-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scripts/qjs/cu-retirement-cell-smoke.qjs
            scripts/qjs/native-acu-composition-smoke.qjs
            scripts/qjs/acu-provider-smoke.qjs
            scripts/qjs/acu-mcp-provider-smoke.qjs
            scripts/qjs/acu-power-action-provider-smoke.qjs
            scripts/qjs/cu-setup-cli-smoke.qjs
            scripts/qjs/cu-setup-runtime-refresh-smoke.qjs
            scripts/qjs/lib/rh_compat.qjs
            scripts/qjs/lib/test_harness.qjs
          if-no-files-found: error
          retention-days: 2

  # Hosted jobs import exact locally compiled bytes. This matrix may package
  # the native Linux archives from those bytes, but never invokes Cargo.
  stage_parts:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: windows-x86_64
            runner: windows-2025
            family: windows
            cell: win-x86_64
          - platform_id: windows-aarch64
            runner: ubuntu-24.04
            family: windows
            cell: win-aarch64
          - platform_id: linux-x86_64
            runner: ubuntu-24.04
            family: linux
            cell: lnx-x86_64
          - platform_id: linux-aarch64
            runner: ubuntu-24.04-arm
            family: linux
            cell: lnx-aarch64
          - platform_id: macos-aarch64
            runner: macos-15
            family: macos
            cell: osx-aarch64
          - platform_id: macos-x86_64
            # GitHub's Intel macOS queue is scarce. This runner is ARM64 and
            # executes the locally built x86_64 product through Rosetta.
            runner: macos-15
            family: macos
            cell: osx-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Download verified local build inputs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.preflight.outputs.local_input_artifact }}
          path: local-input

      - name: Import local package or package native Linux bytes
        shell: bash
        env:
          PLATFORM_ID: ${{ matrix.platform_id }}
          CELL: ${{ matrix.cell }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          part="candidate-part"
          mkdir -p "$part"
          if [[ "$PLATFORM_ID" == linux-* ]]; then
            case "$PLATFORM_ID" in
              linux-x86_64) arch=x86_64; target=x86_64-unknown-linux-gnu ;;
              linux-aarch64) arch=aarch64; target=aarch64-unknown-linux-gnu ;;
              *) echo "unsupported Linux cell" >&2; exit 2 ;;
            esac
            sudo apt-get update
            sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libwayland-client0
            binary_dir="target/$target/release"
            mkdir -p "$binary_dir"
            cp "local-input/raw-linux/$PLATFORM_ID/"* "$binary_dir/"
            chmod +x "$binary_dir/agenterm" "$binary_dir/agenterm-cu"
            mkdir -p dist
            AGENTERM_HOST_OS=linux AGENTERM_HOST_ARCH="$arch" \
              AGENTERM_PACKAGE_DIST="$PWD/dist" \
              "$binary_dir/agenterm" cli script task run package-client-release \
                --manifest agenterm.tasks.json -- "$PWD" "$version" linux "$arch" "$binary_dir"
            archive="dist/agenterm-$version-linux-$arch.tar.gz"
            cp "$archive" "$archive.sha256" "$archive.provenance.json" "$part/"
            mkdir -p "$part/chassis-l1"
            cp -R "local-input/chassis-l1/$CELL" "$part/chassis-l1/"
          else
            cp -R "local-input/candidate-part-$PLATFORM_ID/." "$part/"
          fi
          test -f "$part/loader.json" -o -f "$part/chassis-l1/$CELL/loader.json"

      - name: Upload unsigned Windows candidate input
        if: startsWith(matrix.platform_id, 'windows-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-unsigned-part-${{ matrix.platform_id }}
          path: candidate-part/
          if-no-files-found: error
          retention-days: 2

      - name: Upload final non-Windows candidate part
        if: ${{ !startsWith(matrix.platform_id, 'windows-') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-part-${{ matrix.platform_id }}
          path: candidate-part/
          if-no-files-found: error
          retention-days: 2

  windows_unsigned:
    needs: [preflight, stage_parts]
    if: needs.preflight.outputs.signed_windows != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # `off` is a real credential-free path. It copies the exact build parts
      # into the canonical names consumed by runtime and aggregate.
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: candidate-unsigned-part-windows-x86_64
          path: final/windows-x86_64
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: candidate-unsigned-part-windows-aarch64
          path: final/windows-aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-part-windows-x86_64
          path: final/windows-x86_64/
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-part-windows-aarch64
          path: final/windows-aarch64/
          if-no-files-found: error
          retention-days: 2

  windows_sign:
    needs: [preflight, stage_parts]
    if: needs.preflight.outputs.signed_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: candidate-unsigned-part-windows-x86_64
          path: unsigned/windows-x86_64
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: candidate-unsigned-part-windows-aarch64
          path: unsigned/windows-aarch64

      - name: Require protected Azure signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT',
            'ARTIFACT_SIGNING_PROFILE'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "required release-signing value is missing: $name"
            }
          }

      - name: Verify exact unsigned inputs and prepare twelve-file catalog
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content release-policy.json -Raw | ConvertFrom-Json).version
          ./scripts/windows-signing-candidate.ps1 -Mode Prepare `
            -InputRoot unsigned -SigningRoot signing-input -OutputRoot final `
            -SourceSha $env:SOURCE_SHA -Version $version `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT

      - name: Upload immutable unsigned signing input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-windows-signing-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            signing-input/
            windows-signing-state.json
          if-no-files-found: error
          retention-days: 14

      - name: Azure login (GitHub OIDC, profile-scoped signer)
        uses: azure/login@0949e32778441b2c442592b7a0e6313466dc8f29 # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign exact twelve Windows files with Azure Artifact Signing
        uses: Azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-catalog: signing-input/signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: AgenTerm
          description-url: https://github.com/partnernetsoftware/agenterm
          exclude-workload-identity-credential: true
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          correlation-id: agenterm-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify signatures and rebuild final Windows archives
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content release-policy.json -Raw | ConvertFrom-Json).version
          ./scripts/windows-signing-candidate.ps1 -Mode Finalize `
            -InputRoot unsigned -SigningRoot signing-input -OutputRoot final `
            -SourceSha $env:SOURCE_SHA -Version $version `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-part-windows-x86_64
          path: final/windows-x86_64/
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-part-windows-aarch64
          path: final/windows-aarch64/
          if-no-files-found: error
          retention-days: 2

  # The one sealed chassis product of this Candidate. Composed once from the
  # final (signed or unsigned-policy) parts, before runtime, so every runtime
  # cell installs these exact bytes and aggregate seals the same file. The
  # installer, its L3 contract module and the journey script travel with it
  # from the same exact-source checkout, because runtime never checks out.
  chassis_pack:
    needs: [preflight, stage_parts, windows_unsigned, windows_sign]
    if: >-
      always() && needs.stage_parts.result == 'success' &&
      ((needs.preflight.outputs.signed_windows == 'true' && needs.windows_sign.result == 'success') ||
       (needs.preflight.outputs.signed_windows != 'true' && needs.windows_unsigned.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Named by the attempt that uploads it; a rerun of failed jobs keeps
      # this job and its output, so consumers never rebuild the name.
      artifact: candidate-chassis-product-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Download final candidate parts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: candidate-part-*
          merge-multiple: true
          path: candidate-input

      - name: Compose Candidate chassis product without Cargo
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          mkdir -p chassis-product
          python3 scripts/chassis-candidate-pack.py \
            --candidate-input candidate-input \
            --version "$version" \
            --source-sha "$SOURCE_SHA" \
            --out "chassis-product/agenterm-$version-chassis-product.tgz"
          cp scripts/chassis-install-product.py scripts/chassis_l3_app.py \
            scripts/qjs/chassis-installed-journey.qjs chassis-product/
          (cd chassis-product && sha256sum -c "agenterm-$version-chassis-product.tgz.sha256")

      - name: Upload Candidate chassis product
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-chassis-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: chassis-product/
          if-no-files-found: error
          retention-days: 14

  runtime:
    needs: [preflight, stage_parts, windows_unsigned, windows_sign, chassis_pack]
    if: >-
      always() && needs.stage_parts.result == 'success' && needs.chassis_pack.result == 'success' &&
      ((needs.preflight.outputs.signed_windows == 'true' && needs.windows_sign.result == 'success') ||
       (needs.preflight.outputs.signed_windows != 'true' && needs.windows_unsigned.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: windows-x86_64
            runner: windows-2025
            family: windows
            expected_os: Windows
            expected_arch: X64
          - platform_id: windows-aarch64
            runner: windows-11-arm
            family: windows
            expected_os: Windows
            expected_arch: ARM64
          - platform_id: linux-x86_64
            runner: ubuntu-24.04
            family: linux
            expected_os: Linux
            expected_arch: X64
          - platform_id: linux-aarch64
            runner: ubuntu-24.04-arm
            family: linux
            expected_os: Linux
            expected_arch: ARM64
          - platform_id: macos-aarch64
            runner: macos-15
            family: macos
            expected_os: macOS
            expected_arch: ARM64
          - platform_id: macos-x86_64
            runner: macos-15
            family: macos
            expected_os: macOS
            expected_arch: ARM64
            execute_arch: X64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      # Runtime courts consume only the locally packaged archive for their
      # platform. They deliberately do not checkout source or invoke Cargo.
      - name: Download matching Candidate part
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: candidate-part-${{ matrix.platform_id }}
          path: part

      - name: Download exact-source ACU runtime control
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.preflight.outputs.runtime_control_artifact }}
          path: runtime-control

      - name: Download sealed Candidate chassis product
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.chassis_pack.outputs.artifact }}
          path: chassis

      - name: Guard runner identity (no compile)
        shell: bash
        env:
          EXPECTED_RUNNER_OS: ${{ matrix.expected_os }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Execute final Windows archive
        if: matrix.family == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find part -maxdepth 1 -type f \
            -name 'agenterm-*-windows-*.zip' -print -quit)"
          test -n "$archive"
          (cd part && sha256sum -c "$(basename "$archive").sha256")
          actual_hash="$(sha256sum "$archive" | cut -d' ' -f1)"
          mkdir runtime
          python -m zipfile -e "$archive" runtime
          version="$(python -c \
            'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' \
            "$archive.provenance.json")"
          output="$(runtime/agenterm.com cli --version)"
          grep -Fq "$version" <<<"$output"
          echo "PASS ${{ matrix.platform_id }} $actual_hash $output"

      - name: Verify final Windows signature policy
        if: matrix.family == 'windows'
        shell: pwsh
        env:
          SIGNED_WINDOWS: ${{ needs.preflight.outputs.signed_windows }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content runtime/artifacts.json -Raw | ConvertFrom-Json
          $arch = if ('${{ matrix.platform_id }}' -eq 'windows-aarch64') { 'aarch64' } else { 'x86_64' }
          $platform = @($manifest.platforms | Where-Object { $_.os -eq 'windows' -and $_.arch -eq $arch })
          if ($platform.Count -ne 1) { throw "Windows artifact manifest cell mismatch: $arch" }
          $names = @($platform[0].executables.name) + @($platform[0].libraries.name)
          if ($names.Count -ne 6 -or @($names | Sort-Object -Unique).Count -ne 6) {
            throw "Windows signature allowlist mismatch: $arch"
          }
          foreach ($name in $names) {
            $path = Join-Path runtime $name
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            if ($env:SIGNED_WINDOWS -eq 'true') {
              if ($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate -or
                  $null -eq $sig.TimeStamperCertificate -or
                  $sig.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=PARTNERNET SOFTWARE PTY LTD(?:,|$)') {
                throw "signed Candidate verification failed: $name ($($sig.Status))"
              }
            } elseif ($sig.Status -ne 'NotSigned') {
              throw "unsigned Candidate unexpectedly carries a signature: $name ($($sig.Status))"
            }
          }
          "AUTHENTICODE PASS ${{ matrix.platform_id }} mode=$env:SIGNED_WINDOWS"

      - name: Scan final Windows Candidate bytes with Defender
        if: matrix.family == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          program_files="$(cygpath -u "$PROGRAMFILES")"
          program_data_windows="${PROGRAMDATA:-${ProgramData:-C:\\ProgramData}}"
          program_data="$(cygpath -u "$program_data_windows")"
          mpcmd="$program_files/Windows Defender/MpCmdRun.exe"
          if [[ ! -f "$mpcmd" ]]; then
            mpcmd="$(find "$program_data/Microsoft/Windows Defender/Platform" \
              -type f -name MpCmdRun.exe -print 2>/dev/null | sort -r | head -n 1)"
          fi
          test -n "$mpcmd" && test -f "$mpcmd"
          "$mpcmd" -Scan -ScanType 3 -File "$(cygpath -w "$PWD/runtime")" \
            -DisableRemediation
          echo "DEFENDER PASS ${{ matrix.platform_id }}"

      - name: Execute final Linux archive
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find part -maxdepth 1 -type f \
            -name 'agenterm-*-linux-*.tar.gz' -print -quit)"
          test -n "$archive"
          (cd part && sha256sum -c "$(basename "$archive").sha256")
          mkdir runtime
          tar -xzf "$archive" -C runtime
          chmod +x runtime/agenterm
          version="$(jq -r .version "$archive.provenance.json")"
          output="$(runtime/agenterm cli --version)"
          grep -Fq "$version" <<<"$output"
          echo "PASS ${{ matrix.platform_id }} $(sha256sum "$archive" | cut -d' ' -f1) $output"

      - name: Prove Linux bundle closure in package-free Ubuntu
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # Official Ubuntu 24.04 multi-arch index, pinned so the court cannot
          # drift independently of the Candidate workflow hash.
          image='ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517'
          docker run --rm \
            -v "$PWD/runtime:/court:ro" \
            "$image" \
            bash -euo pipefail -c '
              shopt -s nullglob
              libraries=(/court/lib/*.so*)
              test "${#libraries[@]}" -gt 0
              for library in "${libraries[@]}"; do
                report="$(LD_LIBRARY_PATH=/court/lib ldd "$library")"
                missing="$(grep "not found" <<<"$report" || true)"
                if test -n "$missing"; then
                  echo "$library: $missing" >&2
                  exit 1
                fi
              done
              LD_LIBRARY_PATH=/court/lib /court/agenterm cli --version
            '

      - name: Execute final macOS archive
        if: matrix.family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find part -maxdepth 1 -type f \
            -name 'agenterm-*-macos-*.zip' -print -quit)"
          test -n "$archive"
          (cd part && shasum -a 256 -c "$(basename "$archive").sha256")
          mkdir runtime
          ditto -x -k "$archive" runtime
          chmod +x runtime/agenterm
          version="$(jq -r .version "$archive.provenance.json")"
          if [[ "${{ matrix.platform_id }}" == macos-x86_64 ]]; then
            file runtime/agenterm | grep -Eq 'Mach-O 64-bit executable x86_64'
            output="$(arch -x86_64 runtime/agenterm cli --version)"
          else
            file runtime/agenterm | grep -Eq 'Mach-O 64-bit executable arm64'
            output="$(runtime/agenterm cli --version)"
          fi
          grep -Fq "$version" <<<"$output"
          echo "PASS ${{ matrix.platform_id }} $(shasum -a 256 "$archive" | cut -d' ' -f1) $output"

      # The installed product through the public CLI on this target cell. The
      # cell is stated from the matrix, never read from the runner's Python,
      # which may report an emulated architecture on Windows ARM64.
      - name: Installed chassis product public journey
        shell: bash
        env:
          PLATFORM_ID: ${{ matrix.platform_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          case "$PLATFORM_ID" in
            windows-x86_64) cell=win-x86_64 arch=X64 ;;
            windows-aarch64) cell=win-aarch64 arch=ARM64 ;;
            linux-x86_64) cell=lnx-x86_64 arch=X64 ;;
            linux-aarch64) cell=lnx-aarch64 arch=ARM64 ;;
            macos-x86_64) cell=osx-x86_64 arch=X64 ;;
            macos-aarch64) cell=osx-aarch64 arch=ARM64 ;;
            *) echo "unknown platform $PLATFORM_ID" >&2; exit 1 ;;
          esac
          test "$RUNNER_ARCH" = "$arch"
          if [ "${{ matrix.family }}" = windows ]; then
            py=python; cli=runtime/agenterm.com; server=runtime/agenterm.exe
          else
            py=python3; cli=runtime/agenterm; server=runtime/agenterm
          fi
          tgz="$(find chassis -maxdepth 1 -type f -name 'agenterm-*-chassis-product.tgz' -print -quit)"
          test -n "$tgz"
          tgz_sha="$(cut -d' ' -f1 "$tgz.sha256")"
          scratch="$RUNNER_TEMP/chassis-journey"
          mkdir -p "$scratch" chassis-receipt
          "$py" chassis/chassis-install-product.py --archive "$tgz" \
            --checksum "$tgz.sha256" --install-dir "$scratch/image" --native-cell "$cell"
          "$cli" cli script run --profile tool --timeout-ms 300000 \
            --max-operations 1000000000 chassis/chassis-installed-journey.qjs -- \
            "$PWD/$cli" "$PWD/$server" "$scratch/image" "$tgz_sha" "$PLATFORM_ID" \
            "$scratch" "$PWD/chassis-receipt/journey.json"
          "$py" - "$PWD/chassis-receipt/journey.json" "$PWD/chassis-receipt/receipt.json" \
            "$cell" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_SHA" <<'PY'
          import json, sys
          journey, out, cell, run_id, attempt, sha = sys.argv[1:]
          receipt = json.load(open(journey, encoding="utf-8"))
          if receipt.get("cell") != cell:
              sys.exit(f"the final binary loaded cell {receipt.get('cell')}, expected {cell}")
          receipt.update(expected_cell=cell, run_id=run_id, run_attempt=attempt, source_sha=sha)
          json.dump(receipt, open(out, "w", encoding="utf-8"), indent=2, sort_keys=True)
          PY

      - name: Upload installed chassis product receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-chassis-runtime-${{ matrix.platform_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: chassis-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: cu-retirement-cell-smoke
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLATFORM_ID: ${{ matrix.platform_id }}
        run: |
          set -euo pipefail
          archive="$(find part -maxdepth 1 -type f \
            \( -name 'agenterm-*-windows-*.zip' \
              -o -name 'agenterm-*-linux-*.tar.gz' \
              -o -name 'agenterm-*-macos-*.zip' \) -print -quit)"
          test -n "$archive"
          case "${{ matrix.family }}" in
            windows)
              archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
              launcher="runtime/agenterm.com"
              consumer="runtime/agenterm.exe"
              cu="runtime/agenterm-cu.exe"
              provider="runtime/agenterm-cu-provider.dll"
              abi="runtime/agenterm.dll"
              ;;
            linux)
              archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
              launcher="runtime/agenterm"
              consumer="runtime/agenterm"
              cu="runtime/agenterm-cu"
              provider="runtime/agenterm-cu-provider.so"
              abi="runtime/libagenterm.so"
              chmod +x "$launcher" "$cu"
              ;;
            macos)
              archive_sha256="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
              launcher="runtime/agenterm"
              consumer="runtime/agenterm"
              cu="runtime/agenterm-cu"
              provider="runtime/agenterm-cu-provider.dylib"
              abi="runtime/libagenterm.dylib"
              chmod +x "$launcher" "$cu"
              ;;
          esac
          test -f "$launcher" && test -f "$consumer" && test -f "$cu" \
            && test -f "$provider" && test -f "$abi"
          mkdir -p runtime-evidence
          AGENTERM_NO_ACTIVATE=1 "$launcher" cli script run --profile tool \
            --timeout-ms 120000 --max-operations 100000000 \
            --max-output-bytes 262144 \
            runtime-control/cu-setup-cli-smoke.qjs -- \
            "$PWD" "$cu" "runtime-evidence/setup-$PLATFORM_ID.json" "$PLATFORM_ID"
          AGENTERM_NO_ACTIVATE=1 "$launcher" cli script run --profile tool \
            --timeout-ms 120000 --max-operations 100000000 \
            --max-output-bytes 262144 \
            runtime-control/cu-setup-runtime-refresh-smoke.qjs -- \
            "$PWD" "$cu" "runtime-evidence/setup-refresh-$PLATFORM_ID.json" "$PLATFORM_ID"
          # Both engine budgets, named. Without them this cell runs on the
          # engine's defaults, which are sized for a quick script rather than
          # for a suite that spawns six child gates -- on a slower cell it is
          # cancelled mid-flight and reports "cancelled by the host while
          # waiting", which says nothing about what it was waiting for.
          AGENTERM_NO_ACTIVATE=1 "$launcher" cli script run --profile tool \
            --timeout-ms 900000 --max-operations 1000000000 \
            runtime-control/cu-retirement-cell-smoke.qjs -- \
            "$launcher" "$consumer" "$cu" "$provider" "$abi" \
            "$PLATFORM_ID" "$SOURCE_SHA" "$archive_sha256" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "runtime-evidence/$PLATFORM_ID.json" \
            "runtime-evidence/setup-$PLATFORM_ID.json" \
            "runtime-evidence/setup-refresh-$PLATFORM_ID.json" \
            "runtime-control/acu-provider-smoke.qjs" \
            "runtime-control/acu-mcp-provider-smoke.qjs" \
            "runtime-control/acu-power-action-provider-smoke.qjs" \
            "runtime-control/native-acu-composition-smoke.qjs"

      - name: Upload ACU native runtime receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-cu-runtime-${{ matrix.platform_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-evidence/${{ matrix.platform_id }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    needs: [preflight, stage_parts, windows_unsigned, windows_sign, chassis_pack, runtime]
    if: >-
      always() && needs.stage_parts.result == 'success' && needs.runtime.result == 'success' &&
      needs.chassis_pack.result == 'success' &&
      ((needs.preflight.outputs.signed_windows == 'true' && needs.windows_sign.result == 'success') ||
       (needs.preflight.outputs.signed_windows != 'true' && needs.windows_unsigned.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Download candidate parts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: candidate-part-*
          merge-multiple: true
          path: candidate-input

      - name: Download verified local build evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.preflight.outputs.local_input_artifact }}
          path: local-build-input

      - name: Download exact-attempt ACU runtime receipts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          # Every attempt of this run, one directory per artifact (no merge):
          # a rerun of failed cells leaves the passing cells at their own
          # earlier attempt. The aggregator takes each cell's highest attempt
          # and requires its receipt to name that same run and attempt.
          pattern: candidate-cu-runtime-*-${{ github.run_id }}-*
          path: runtime-evidence

      - name: Write candidate workflow metadata
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          workflow_sha256="$(sha256sum .github/workflows/candidate.yml | cut -d' ' -f1)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          created_at_unix_ms="$(( $(date -u +%s) * 1000 ))"
          expires_at_unix_ms="$(( created_at_unix_ms + 1209600000 ))"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$version" \
            --arg workflow_sha256 "$workflow_sha256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson created_at_unix_ms "$created_at_unix_ms" \
            --argjson expires_at_unix_ms "$expires_at_unix_ms" \
            '{
              schema_version: 1,
              source_sha: $source_sha,
              version: $version,
              expected_tag: ("v" + $version),
              workflow_path: ".github/workflows/candidate.yml",
              workflow_sha256: $workflow_sha256,
              run_id: $run_id,
              run_attempt: $run_attempt,
              run_event: env.GITHUB_EVENT_NAME,
              created_at_unix_ms: $created_at_unix_ms,
              expires_at_unix_ms: $expires_at_unix_ms
            }' >candidate-metadata.json

      - name: Extract candidate Script Runtime
        run: |
          set -euo pipefail
          archive="$(find candidate-input -maxdepth 1 -type f \
            -name 'agenterm-*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/agenterm-candidate-tool"
          tar -xzf "$archive" -C "$RUNNER_TEMP/agenterm-candidate-tool"
          chmod +x "$RUNNER_TEMP/agenterm-candidate-tool/agenterm"

      # Seal the chassis product the runtime cells installed, not a second
      # composition, and only when every cell's receipt names these bytes.
      - name: Download sealed Candidate chassis product
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ needs.chassis_pack.outputs.artifact }}
          path: chassis-product

      - name: Download installed chassis product receipts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          # Every attempt of this run, one directory per artifact (no merge):
          # a rerun of failed cells leaves the passing cells at their own
          # earlier attempt, so the consumer must not name them from its own.
          pattern: candidate-chassis-runtime-*-${{ github.run_id }}-*
          path: chassis-receipts

      - name: Bind installed-product receipts to the sealed chassis bytes
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version="$(jq -r .version candidate-metadata.json)"
          tgz="agenterm-$version-chassis-product.tgz"
          (cd chassis-product && sha256sum -c "$tgz.sha256")
          tgz_sha="$(cut -d' ' -f1 "chassis-product/$tgz.sha256")"
          # The verified six-cell summary is sealed with the Candidate.
          mkdir -p candidate-output/evidence
          python3 scripts/chassis-runtime-receipts.py \
            --receipts-dir chassis-receipts --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$SOURCE_SHA" \
            --tgz-sha256 "$tgz_sha" \
            > candidate-output/evidence/chassis-six-cell-runtime.json
          cp "chassis-product/$tgz" "chassis-product/$tgz.sha256" \
            "chassis-product/$tgz.provenance.json" candidate-input/
          cp local-build-input/qualification-receipt.json \
            local-build-input/local-build-manifest.json candidate-input/
          cp local-build-input/agenterm-"$version"-sbom.spdx.json candidate-input/
          cp local-build-input/pre-push-check.log candidate-input/

      - name: Seal exact candidate bundle
        run: |
          set -euo pipefail
          version="$(jq -r .version candidate-metadata.json)"
          test -f candidate-input/qualification-receipt.json
          mkdir -p candidate-output/payload
          mkdir -p candidate-output/evidence
          find candidate-input -mindepth 1 -maxdepth 1 -type f \
            -exec cp -- {} candidate-output/payload/ \;
          "$RUNNER_TEMP/agenterm-candidate-tool/agenterm" cli script run \
            --profile tool --timeout-ms 300000 --max-operations 100000000 \
            scripts/qjs/cu-retirement-runtime-aggregate.qjs -- \
            runtime-evidence "${{ inputs.source_sha }}" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            candidate-output/evidence/cu-six-cell-runtime.json
          "$RUNNER_TEMP/agenterm-candidate-tool/agenterm" cli script \
            task run candidate-aggregate --manifest agenterm.tasks.json -- \
            . candidate-metadata.json candidate-output/payload \
            candidate-output/evidence/cu-six-cell-runtime.json \
            "candidate-output/agenterm-$version-candidate-manifest.json"

      - name: Upload sealed candidate
        id: candidate-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: candidate-output/
          if-no-files-found: error
          retention-days: 14

      - name: Report candidate identity
        env:
          ARTIFACT_DIGEST: ${{ steps.candidate-upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.candidate-upload.outputs.artifact-id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          manifest="$(find candidate-output -maxdepth 1 -type f \
            -name 'agenterm-*-candidate-manifest.json' -print -quit)"
          test -f "$manifest"
          {
            echo "## AgenTerm release candidate"
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- Retention: 14 days"
            echo
            echo "### Native archive sizes"
            echo
            echo "| Cell | Payload bytes | Archive bytes |"
            echo "|---|---:|---:|"
            jq -r '.assets[] | select(.os != "chassis") |
              "| \(.os)-\(.arch) | \(.payload_uncompressed_bytes) | \(.size) |"' \
              "$manifest"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Publish candidate delivery timing evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        if: always()
        run: |
          set -euo pipefail
          mkdir -p delivery-timing

          run_id="${CANDIDATE_RUN_ID}"
          workflow_name="Release Candidate"
          api_url="${GITHUB_API_URL%/}"
          run_json="$(mktemp)"
          jobs_json="$(mktemp)"

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api_url/repos/$GH_REPO/actions/runs/$run_id" > "$run_json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api_url/repos/$GH_REPO/actions/runs/$run_id/jobs?filter=all&per_page=200" \
            > "$jobs_json"

          python3 - "$run_json" "$jobs_json" "$workflow_name" "$run_id" "$GH_REPO" "$SOURCE_SHA" <<'PY'
          import datetime
          import json
          import os
          import sys

          def to_ms(value):
              if not value:
                  return None
              dt = datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
              return int(dt.timestamp() * 1000)

          run = json.load(open(sys.argv[1], encoding="utf-8"))
          jobs_document = json.load(open(sys.argv[2], encoding="utf-8"))
          workflow_name = sys.argv[3]
          run_id = int(sys.argv[4])
          repository = sys.argv[5]
          source_sha = sys.argv[6]

          run_start = to_ms(run.get("run_started_at"))
          run_end = to_ms(run.get("updated_at"))
          queue_ms = None
          if run.get("created_at") and run_start is not None:
              queue_ms = max(0, run_start - to_ms(run.get("created_at")))
          run_ms = None if run_start is None or run_end is None else max(0, run_end - run_start)

          def step_ms(step):
              start = to_ms(step.get("started_at"))
              done = to_ms(step.get("completed_at"))
              if start is None or done is None or done < start:
                  return 0
              return max(0, done - start)

          def classify_stages(name):
              key = (name or "").lower()
              if "restore" in key or "cache" in key:
                  return "cache_ms"
              if "checkout" in key:
                  return "checkout_ms"
              if "rustup" in key or "install " in key or "toolchain" in key:
                  return "toolchain_ms"
              if "package" in key:
                  return "package_ms"
              if "upload" in key or "download" in key:
                  return "artifact_transfer_ms"
              if "quality gate" in key or "smoke" in key or "test" in key or "verify" in key:
                  return "test_ms"
              if "build" in key or "bootstrap" in key or "clippy" in key:
                  return "compile_ms"
              if "aggregate" in key:
                  return "aggregate_ms"
              if "create" in key and "release" in key:
                  return "aggregate_ms"
              return None

          stage_ms = {
              "checkout_ms": 0,
              "toolchain_ms": 0,
              "cache_ms": 0,
              "compile_ms": 0,
              "package_ms": 0,
              "test_ms": 0,
              "artifact_transfer_ms": 0,
              "aggregate_ms": 0,
          }
          for job in jobs_document.get("jobs", []):
              steps = job.get("steps") or []
              for step in steps:
                  target = classify_stages(step.get("name", ""))
                  if target is None:
                      continue
                  ms = step_ms(step)
                  stage_ms[target] += ms

          jobs = []
          for job in jobs_document.get("jobs", []):
              j_start = to_ms(job.get("started_at"))
              j_end = to_ms(job.get("completed_at"))
              j_ms = None if j_start is None or j_end is None or j_end < j_start else max(0, j_end - j_start)
              jobs.append({
                  "id": job.get("id"),
                  "name": job.get("name"),
                  "status": job.get("status"),
                  "conclusion": job.get("conclusion"),
                  "duration_ms": j_ms,
              })

          report = {
              "schema_version": 1,
              "kind": "agenterm-delivery-timing",
              "workflow": workflow_name,
              "repository": repository,
              "run_id": run_id,
              "source_sha": source_sha,
              "queue_duration_ms": queue_ms,
              "run_duration_ms": run_ms,
              "stage_duration_ms": stage_ms,
              "jobs": jobs,
          }
          with open("delivery-timing/candidate-delivery-timing.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2, sort_keys=True)
          PY

          rm -f "$run_json" "$jobs_json"

      - name: Upload candidate delivery timing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-delivery-timing-${{ github.run_id }}
          path: delivery-timing/
          if-no-files-found: error
          retention-days: 14
