name: Windows Tool Door Diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit to diagnose; this workflow cannot qualify a release
        required: true
        type: string

permissions:
  contents: read

jobs:
  tool-door:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Verify exact source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Run the complete Windows tool door court
        shell: bash
        run: cargo test --locked -p agenterm-qjswasm --test tool_door -- --nocapture
