[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

# This repo builds on 8-core / 8 GB developer machines, and its test suites can
# spawn nested `cargo build` runs. Uncapped, those multiply into one rustc per
# core *per build* and exhaust CPU and memory, which stalls the whole host
# rather than just running slowly.
#
# 6 of 8 cores leaves headroom for the editor, the GUI under test, and the
# nested builds. Override per-invocation with `cargo build -j N` or CARGO_BUILD_JOBS
# when a machine can afford more.
[build]
jobs = 6

# `agenterm-qjswasm` depends on the private `partnernetsoftware/tinyvm` by git
# revision. Cargo's built-in libgit2 client cannot present GitHub credentials
# for it -- measured, not assumed: `cargo fetch` failed with
# `failed to receive HTTP 200 response: got 401; class=Net (12)`, and the same
# fetch succeeded once routed through the system `git` binary, which already
# holds the developer's credentials. Set here rather than as a per-invocation
# environment variable so a fresh clone builds without tribal knowledge.
[net]
git-fetch-with-cli = true
