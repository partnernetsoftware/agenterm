[package]
name = "size-probe"
version = "0.1.18"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Milestone 15: static vs dynamic two-variant size probe for Phase 0 criterion 2"
license = "MIT OR Apache-2.0"

# The two binaries are explicit; `autobins = false` also keeps this package
# from being auto-discovered as the root package's example target.
autobins = false

[[bin]]
name = "size-probe-variant-a-static"
path = "src/variant_a_static.rs"

[[bin]]
name = "size-probe-variant-b-dynamic"
path = "src/variant_b_dynamic.rs"

[dependencies]
# Variant A only: statically links the mechanism code it actually calls.
# The feature list is copied verbatim from the `agenterm-abi` dependency in
# `crates/agenterm-abi/Cargo.toml` (neither more nor fewer): milestone 34 adds
# `screenshot` + `a11y-tree` (and `portable-pixel-window`, which the ABI also
# enables) so the probe links exactly the mechanism set the delivered
# libagenterm ships. `process` also pulls in `parent-console` + `runtime`;
# `clipboard` is explicit; `window_host` and its `run_pixel_window` entry
# require `input` + `ime` + a pixel-window feature.
agenterm-platform = { path = "../../crates/agenterm-platform", features = ["pty", "native-pixel-window", "portable-pixel-window", "input", "ime", "screenshot", "process", "clipboard", "parent-console", "a11y-tree", "runtime"] }

# Variant B only: the dynamic path never depends on agenterm-platform; it
# dlopens the libagenterm cdylib through this tiny loader. `libloading` is
# the only non-std dependency of variant B, so the mechanism code cannot
# statically enter its artifact.
libloading = "0.8"
